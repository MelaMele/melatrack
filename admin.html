<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MelaTrack - Admin Dashboard v4</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', sans-serif; }
    .header-title { background: linear-gradient(135deg, #1e3a8a, #3b82f6); color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
    .stat-card { border: none; border-radius: 12px; transition: transform 0.2s; }
    .stat-card:hover { transform: translateY(-3px); }
    .badge-present { background-color: #10b981; color: white; }
    .badge-late { background-color: #f97316; color: white; }
    .badge-permission { background-color: #f59e0b; color: white; }
    .badge-missed { background-color: #ef4444; color: white; animation: blink 1.5s infinite; }
    .badge-absent { background-color: #6b7280; color: white; }
    @keyframes blink { 50% { opacity: 0.6; } }
  </style>
</head>
<body>

<div class="container my-4">
  <!-- Header -->
  <div class="header-title shadow-sm d-flex justify-content-between align-items-center">
    <div>
      <h2 class="mb-1">📊 MelaTrack Admin Dashboard</h2>
      <p class="mb-0 opacity-75">የሰራተኞች የክትትል፣ የሰዓት እና የቼክ አውት ቁጥጥር ሲስተም</p>
    </div>
  </div>

  <!-- Analytics Summary Cards -->
  <div class="row g-3 mb-4">
    <div class="col-md-3">
      <div class="card stat-card bg-primary text-white p-3 shadow-sm">
        <small class="opacity-75">👥 ጠቅላላ ሰራተኞች</small>
        <h3 class="mb-0 mt-1" id="cardTotal">0</h3>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card stat-card bg-success text-white p-3 shadow-sm">
        <small class="opacity-75">✅ በሰዓት የተገኙ (Present)</small>
        <h3 class="mb-0 mt-1" id="cardPresent">0</h3>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card stat-card text-white p-3 shadow-sm" style="background-color: #f97316;">
        <small class="opacity-75">⏱️ ዘግይተው የገቡ (Late)</small>
        <h3 class="mb-0 mt-1" id="cardLate">0</h3>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card stat-card bg-danger text-white p-3 shadow-sm">
        <small class="opacity-75">⚠️ Missed Check-Out / ቀሪ</small>
        <h3 class="mb-0 mt-1" id="cardMissed">0</h3>
      </div>
    </div>
  </div>

  <!-- Main Report Table -->
  <div class="card shadow-sm border-0">
    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
      <h5 class="mb-0 text-dark">📋 የዕለታዊ ክትትል እና የስራ ሰዓት ሪፖርት</h5>
      <div class="d-flex align-items-center gap-2">
        <input type="date" id="reportDate" class="form-control w-auto" onchange="loadDailyReport()">
        <button onclick="exportToCSV()" class="btn btn-outline-success">📥 Export CSV</button>
      </div>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>ስም</th>
              <th>ክፍል</th>
              <th>Check In</th>
              <th>Check Out</th>
              <th>የቆይታ ሰዓት</th>
              <th>ሁኔታ (Status)</th>
              <th>ምክንያት/ማስታወሻ</th>
              <th>ድርጊት</th>
            </tr>
          </thead>
          <tbody id="attendanceTableBody">
            <tr><td colspan="9" class="text-center py-4">መረጃ እየተጫነ ነው...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec";
  let currentDailyData = [];

  document.addEventListener("DOMContentLoaded", function () {
    document.getElementById('reportDate').valueAsDate = new Date();
    loadDailyReport();
  });

  function loadDailyReport() {
    const selectedDate = document.getElementById('reportDate').value;
    const tbody = document.getElementById('attendanceTableBody');
    tbody.innerHTML = '<tr><td colspan="9" class="text-center py-4">መረጃ እየተጫነ ነው...</td></tr>';

    fetch(`${SCRIPT_URL}?action=getDailyReport&date=${selectedDate}`)
      .then(res => res.json())
      .then(data => {
        tbody.innerHTML = '';
        currentDailyData = data.daily || [];

        let countTotal = currentDailyData.length;
        let countPresent = 0;
        let countLate = 0;
        let countMissed = 0;

        if (countTotal === 0) {
          tbody.innerHTML = '<tr><td colspan="9" class="text-center py-4 text-muted">ምንም የተመዘገበ ሰራተኛ የለም።</td></tr>';
          updateCards(0, 0, 0, 0);
          return;
        }

        currentDailyData.forEach(item => {
          let statusBadge = '';
          if (item.status === 'Present') {
            statusBadge = '<span class="badge badge-present px-2 py-1">✅ Present</span>';
            countPresent++;
          } else if (item.status === 'Late') {
            statusBadge = '<span class="badge badge-late px-2 py-1">⏱️ Late</span>';
            countLate++;
          } else if (item.status === 'Missed Check-Out') {
            statusBadge = '<span class="badge badge-missed px-2 py-1">⚠️ Missed Check-Out</span>';
            countMissed++;
          } else if (item.status === 'Permission') {
            statusBadge = '<span class="badge badge-permission px-2 py-1">⚠️ Permission</span>';
          } else {
            statusBadge = '<span class="badge badge-absent px-2 py-1">❌ Absent</span>';
            countMissed++;
          }

          const row = `
            <tr>
              <td><strong>${item.id}</strong></td>
              <td>${item.full_name}</td>
              <td>${item.department}</td>
              <td>${item.check_in || '-'}</td>
              <td>${item.check_out || '-'}</td>
              <td><span class="fw-bold text-secondary">${item.total_hours}</span></td>
              <td>${statusBadge}</td>
              <td><small class="text-muted">${item.reason || '-'}</small></td>
              <td>
                <button onclick="resetDevice('${item.id}')" class="btn btn-sm btn-outline-secondary me-1">🔄 Reset Phone</button>
                <button onclick="deleteEmployee('${item.id}', '${item.full_name}')" class="btn btn-sm btn-outline-danger">🗑️ መሰረዝ</button>
              </td>
            </tr>
          `;
          tbody.innerHTML += row;
        });

        updateCards(countTotal, countPresent, countLate, countMissed);
      })
      .catch(err => {
        tbody.innerHTML = `<tr><td colspan="9" class="text-center text-danger py-4">መረጃ ማምጣት አልተቻለም፦ ${err}</td></tr>`;
      });
  }

  function updateCards(total, present, late, missed) {
    document.getElementById('cardTotal').innerText = total;
    document.getElementById('cardPresent').innerText = present;
    document.getElementById('cardLate').innerText = late;
    document.getElementById('cardMissed').innerText = missed;
  }

  function exportToCSV() {
    if (!currentDailyData || currentDailyData.length === 0) return alert("ለማውረድ የሚሆን መረጃ የለም!");
    const selectedDate = document.getElementById('reportDate').value;
    let csvContent = "\uFEFFID,Full Name,Department,Check In,Check Out,Total Hours,Status,Reason\n";

    currentDailyData.forEach(item => {
      const reason = (item.reason || '').replace(/,/g, ' ');
      csvContent += `"${item.id}","${item.full_name}","${item.department}","${item.check_in || '-'}","${item.check_out || '-'}","${item.total_hours}","${item.status}","${reason}"\n`;
    });

    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `Attendance_Report_${selectedDate}.csv`;
    link.click();
  }

  function deleteEmployee(empId, empName) {
    if (confirm(`እርግጠኛ ነዎት ሰራተኛ "${empName}" ከሲስተሙ መሰረዝ ይፈልጋሉ?`)) {
      fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'deleteEmployee', employee_id: empId }) })
      .then(res => res.json()).then(data => { alert(data.message); loadDailyReport(); });
    }
  }

  function resetDevice(empId) {
    if (confirm(`የስልክ ቁልፍ ማንሳት ይፈልጋሉ?`)) {
      fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'resetDevice', employee_id: empId }) })
      .then(res => res.json()).then(data => { alert(data.message); loadDailyReport(); });
    }
  }
</script>

</body>
</html>
