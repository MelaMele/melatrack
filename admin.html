<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MelaTrack - የአስተዳዳሪ ዳሽቦርድ</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600;700&display=swap');
    body {
      font-family: 'Noto Sans Ethiopic', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">

  <!-- Header -->
  <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3 space-x-reverse">
        <i class="fa-solid fa-user-shield text-2xl"></i>
        <h1 class="text-xl font-bold tracking-wide">MelaTrack Admin Dashboard</h1>
      </div>
      <div id="connection-status" class="text-xs bg-indigo-800 px-3 py-1 rounded-full text-indigo-200">
        <i class="fa-solid fa-circle text-green-400 text-[10px] mr-1"></i> ዝግጁ ነው
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-3 gap-6">

    <!-- Left Column: Controls & Forms -->
    <section class="space-y-6">

      <!-- 1. Add Employee Card -->
      <div class="bg-white rounded-xl shadow-sm p-5 border border-slate-200">
        <h2 class="text-lg font-semibold text-slate-700 mb-4 border-b pb-2 flex items-center gap-2">
          <i class="fa-solid fa-user-plus text-indigo-600"></i> አዲስ ሰራተኛ መመዝገብ
        </h2>
        <form id="addEmployeeForm" onsubmit="handleAddEmployee(event)" class="space-y-3">
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">ሙሉ ስም</label>
            <input type="text" id="empName" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">የስራ ክፍል (Department)</label>
            <input type="text" id="empDept" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">ስልክ ቁጥር</label>
            <input type="tel" id="empPhone" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">መግቢያ ሰዓት</label>
              <input type="time" id="empEntry" value="08:00" class="w-full px-2 py-2 border rounded-lg text-sm outline-none">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">መውጫ ሰዓት</label>
              <input type="time" id="empExit" value="17:00" class="w-full px-2 py-2 border rounded-lg text-sm outline-none">
            </div>
          </div>
          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg text-sm font-medium transition shadow">
            መዝግብ
          </button>
        </form>
      </div>

      <!-- 2. GPS Geofence Settings -->
      <div class="bg-white rounded-xl shadow-sm p-5 border border-slate-200">
        <h2 class="text-lg font-semibold text-slate-700 mb-4 border-b pb-2 flex items-center gap-2">
          <i class="fa-solid fa-location-dot text-indigo-600"></i> የ GPS ክልል (Geofence)
        </h2>
        <form id="gpsForm" onsubmit="handleSaveGPS(event)" class="space-y-3">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Latitude</label>
              <input type="number" step="any" id="gpsLat" required class="w-full px-3 py-2 border rounded-lg text-sm outline-none">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Longitude</label>
              <input type="number" step="any" id="gpsLng" required class="w-full px-3 py-2 border rounded-lg text-sm outline-none">
            </div>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">የተፈቀደ ርቀት (በሜትር/Radius)</label>
            <input type="number" id="gpsRadius" value="100" class="w-full px-3 py-2 border rounded-lg text-sm outline-none">
          </div>
          <div class="flex gap-2">
            <button type="button" onclick="getCurrentLocation()" class="w-1/2 bg-slate-200 hover:bg-slate-300 text-slate-700 py-2 rounded-lg text-xs font-medium">
              የአሁኑን ቦታ ያግኙ
            </button>
            <button type="submit" class="w-1/2 bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg text-xs font-medium">
              መቼት አስቀምጥ
            </button>
          </div>
        </form>
      </div>

      <!-- 3. Device Reset -->
      <div class="bg-white rounded-xl shadow-sm p-5 border border-slate-200">
        <h2 class="text-lg font-semibold text-slate-700 mb-4 border-b pb-2 flex items-center gap-2">
          <i class="fa-solid fa-mobile-screen-button text-indigo-600"></i> የስልክ ቁልፍ መፍቻ (Reset Lock)
        </h2>
        <div class="flex gap-2">
          <input type="text" id="resetEmpId" placeholder="ሰራተኛ ID (ምሳሌ: EMP-101)" class="flex-1 px-3 py-2 border rounded-lg text-sm outline-none">
          <button onclick="handleResetDevice()" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg text-sm font-medium">
            ፍታ
          </button>
        </div>
      </div>

    </section>

    <!-- Right Column: Live Attendance Reports -->
    <section class="lg:col-span-2 space-y-6">

      <!-- Summary Cards -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center">
          <p class="text-xs text-slate-500">ጠቅላላ የተገኙ</p>
          <p id="statPresent" class="text-2xl font-bold text-green-600">0</p>
        </div>
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center">
          <p class="text-xs text-slate-500">የዘገዩ</p>
          <p id="statLate" class="text-2xl font-bold text-amber-500">0</p>
        </div>
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center">
          <p class="text-xs text-slate-500">የቀረቡ የፈቃድ ጥያቄዎች</p>
          <p id="statPermission" class="text-2xl font-bold text-blue-500">0</p>
        </div>
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center">
          <p class="text-xs text-slate-500">ያልመጡ (Absent)</p>
          <p id="statAbsent" class="text-2xl font-bold text-red-500">0</p>
        </div>
      </div>

      <!-- Live Attendance Table -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="p-4 border-b flex justify-between items-center bg-slate-50">
          <h2 class="font-bold text-slate-700 flex items-center gap-2">
            <i class="fa-solid fa-list-check text-indigo-600"></i> የእለቱ የሰራተኞች መዝገብ
          </h2>
          <div class="flex items-center gap-2">
            <input type="date" id="reportDate" onchange="loadAdminReport()" class="px-2 py-1 border rounded-lg text-xs outline-none">
            <button onclick="loadAdminReport()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-600 p-2 rounded-lg text-xs">
              <i class="fa-solid fa-rotate"></i>
            </button>
          </div>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-slate-600">
            <thead class="bg-slate-100 text-xs uppercase font-semibold text-slate-500">
              <tr>
                <th class="p-3">ሰራተኛ</th>
                <th class="p-3">ክፍል</th>
                <th class="p-3">Check In</th>
                <th class="p-3">Check Out</th>
                <th class="p-3">ሁኔታ (Status)</th>
                <th class="p-3 text-center">ተግባር</th>
              </tr>
            </thead>
            <tbody id="attendanceTableBody" class="divide-y divide-slate-100">
              <tr>
                <td colspan="6" class="p-4 text-center text-slate-400">መረጃዎችን በመጫን ላይ...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </section>

  </main>

  <!-- JavaScript Logic -->
  <script>
    // ⚠️ የራስዎን Google Apps Script Web App URL እዚህ ይተኩ!
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwjz6Xfrzm9TFbxQ2DN2YEETsopTw1DNtm83q5Xt4ci-55z0DQivgbC1GjYnOoZ9hnP/exec";

    // ገጹ ሲከፈት የእለቱን ቀን ማዘጋጀት እና ሪፖርቱን መጫን
    window.onload = () => {
      document.getElementById("reportDate").value = new Date().toISOString().split('T')[0];
      loadAdminReport();
    };

    // 1. የእለቱን ሪፖርት መጫኛ (Get Live Attendance)
    async function loadAdminReport() {
      const selectedDate = document.getElementById("reportDate").value;
      const tbody = document.getElementById("attendanceTableBody");
      tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i>በመጫን ላይ...</td></tr>`;

      try {
        const response = await fetch(`${SCRIPT_URL}?action=getAdminReport&date=${selectedDate}`);
        const data = await response.json();

        if (data.daily && data.daily.length > 0) {
          tbody.innerHTML = "";
          let pCount = 0, lCount = 0, permCount = 0, aCount = 0;

          data.daily.forEach(emp => {
            // Status counts
            if (emp.status === "Present") pCount++;
            else if (emp.status === "Late") lCount++;
            else if (emp.status === "Permission Pending") permCount++;
            else if (emp.status === "Absent") aCount++;

            // Status Badge Formatting
            let badgeClass = "bg-slate-100 text-slate-600";
            if (emp.status === "Present") badgeClass = "bg-green-100 text-green-700";
            else if (emp.status === "Late") badgeClass = "bg-amber-100 text-amber-700";
            else if (emp.status === "Permission Pending") badgeClass = "bg-blue-100 text-blue-700";
            else if (emp.status === "Absent") badgeClass = "bg-red-100 text-red-700";

            let actionBtn = "";
            if (emp.status === "Permission Pending") {
              actionBtn = `<button onclick="approveLeave('${emp.id}')" class="bg-blue-600 hover:bg-blue-700 text-white px-2 py-1 rounded text-xs">ፈቃድ አፅድቅ</button>`;
            }

            tbody.innerHTML += `
              <tr class="hover:bg-slate-50 transition">
                <td class="p-3 font-medium text-slate-800">${emp.full_name} <br><span class="text-xs text-slate-400">${emp.id}</span></td>
                <td class="p-3">${emp.department}</td>
                <td class="p-3 font-mono text-xs">${emp.check_in || "-"}</td>
                <td class="p-3 font-mono text-xs">${emp.check_out || "-"}</td>
                <td class="p-3"><span class="px-2 py-1 rounded-full text-xs font-semibold ${badgeClass}">${emp.status}</span></td>
                <td class="p-3 text-center">${actionBtn}</td>
              </tr>
            `;
          });

          // Update Stats
          document.getElementById("statPresent").innerText = pCount;
          document.getElementById("statLate").innerText = lCount;
          document.getElementById("statPermission").innerText = permCount;
          document.getElementById("statAbsent").innerText = aCount;

        } else {
          tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400">ምንም አይነት መዝገብ አልተገኘም።</td></tr>`;
        }
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-red-500">መረጃዎችን መጫን አልተቻለም። እባክዎ Script URLን ያረጋግጡ።</td></tr>`;
      }
    }

    // 2. አዲስ ሰራተኛ መመዝገብ (Add Employee)
    async function handleAddEmployee(e) {
      e.preventDefault();
      const payload = {
        action: "addEmployee",
        full_name: document.getElementById("empName").value,
        department: document.getElementById("empDept").value,
        phone: document.getElementById("empPhone").value,
        entry_time: document.getElementById("empEntry").value,
        exit_time: document.getElementById("empExit").value
      };

      await sendPostRequest(payload, "አዲስ ሰራተኛ በስኬት ተመዝግቧል!");
      document.getElementById("addEmployeeForm").reset();
      loadAdminReport();
    }

    // 3. የ GPS Geofence መቼት ማስቀመጥ
    async function handleSaveGPS(e) {
      e.preventDefault();
      const payload = {
        action: "saveGPSConfig",
        latitude: document.getElementById("gpsLat").value,
        longitude: document.getElementById("gpsLng").value,
        radius: document.getElementById("gpsRadius").value
      };

      await sendPostRequest(payload, "የ GPS መቼት በስኬት ተቀምጧል!");
    }

    // Current Location Selector
    function getCurrentLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => {
            document.getElementById("gpsLat").value = pos.coords.latitude;
            document.getElementById("gpsLng").value = pos.coords.longitude;
          },
          err => alert("GPS መረጃ ማግኘት አልተቻለም፦ " + err.message)
        );
      } else {
        alert("ስልክዎ/ብራውዘርዎ GPS አያግዝም።");
      }
    }

    // 4. የስልክ ቁልፍ መፍታት (Reset Device)
    async function handleResetDevice() {
      const empId = document.getElementById("resetEmpId").value;
      if (!empId) return alert("እባክዎን የሰራተኛ ID ያስገቡ!");

      const payload = { action: "resetDevice", employee_id: empId };
      await sendPostRequest(payload, "የሰራተኛው የስልክ ቁልፍ ተፈትቷል!");
      document.getElementById("resetEmpId").value = "";
    }

    // 5. የፈቃድ ጥያቄ ማፅደቅ
    async function approveLeave(empId) {
      if (confirm("የዚህን ሰራተኛ ፈቃድ ማፅደቅ ይፈልጋሉ?")) {
        const payload = { action: "approveLeave", employee_id: empId };
        await sendPostRequest(payload, "ፈቃዱ ተጸድቋል!");
        loadAdminReport();
      }
    }

    // Helper POST fetch function
    async function sendPostRequest(payload, successMsg) {
      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (result.status === "success") {
          alert(successMsg);
        } else {
          alert("ስህተት፦ " + result.message);
        }
      } catch (err) {
        alert("ከሲስተሙ ጋር መገናኘት አልተቻለም፦ " + err.message);
      }
    }
  </script>
</body>
</html>
