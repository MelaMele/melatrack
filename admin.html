<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MelaTrack - የአስተዳዳሪ ዳሽቦርድ</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-light); min-height: 100vh; padding: 20px; }

    /* Login Modal Overlay */
    #authOverlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.95); z-index: 1000;
      display: flex; align-items: center; justify-content: center;
    }
    .auth-card {
      background: var(--card-bg); padding: 30px; border-radius: 12px;
      width: 100%; max-width: 360px; text-align: center; border: 1px solid #334155;
    }
    .auth-card input {
      width: 100%; padding: 12px; margin: 15px 0; border-radius: 6px;
      border: 1px solid #334155; background: #0f172a; color: white; text-align: center; font-size: 18px;
    }

    /* Main Container */
    .container { max-width: 1200px; margin: 0 auto; display: none; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid #334155; }
    h1 { font-size: 24px; color: var(--text-light); }
    
    /* Stats Cards */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 25px; }
    .card { background: var(--card-bg); padding: 20px; border-radius: 10px; border: 1px solid #334155; }
    .card-title { color: var(--text-muted); font-size: 14px; margin-bottom: 8px; }
    .card-value { font-size: 28px; font-weight: bold; }

    /* Filters & Tables */
    .filter-section { background: var(--card-bg); padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 15px; flex-wrap: wrap; }
    input[type="date"], input[type="month"], select {
      background: #0f172a; color: white; border: 1px solid #334155; padding: 8px 12px; border-radius: 6px; outline: none;
    }
    
    button {
      background: var(--primary); color: white; border: none; padding: 9px 16px;
      border-radius: 6px; cursor: pointer; transition: 0.2s; font-weight: 600;
    }
    button:hover { background: var(--primary-hover); }
    button.btn-danger { background: var(--danger); }
    button.btn-danger:hover { background: #dc2626; }

    .table-container { background: var(--card-bg); border-radius: 10px; overflow-x: auto; border: 1px solid #334155; margin-bottom: 30px; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 14px 16px; border-bottom: 1px solid #334155; font-size: 14px; }
    th { background: #0f172a; color: var(--text-muted); font-weight: 600; }
    tr:hover { background: #26334d; }

    /* Alert Banner */
    #alertBox {
      display: none; padding: 12px 20px; border-radius: 6px; margin-bottom: 20px;
      font-weight: 500; text-align: center;
    }
    .alert-success { background: rgba(16, 185, 129, 0.2); color: var(--success); border: 1px solid var(--success); }
    .alert-error { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); }

    @media print {
      body { background: white; color: black; }
      .filter-section, button, #authOverlay, header button { display: none !important; }
      .card, .table-container { border: 1px solid #ccc; }
    }
  </style>
</head>
<body>

  <!-- Authentication Modal -->
  <div id="authOverlay">
    <div class="auth-card">
      <i class="fas fa-user-shield fa-3x" style="color: var(--primary); margin-bottom: 15px;"></i>
      <h2>MelaTrack Admin</h2>
      <p style="color: var(--text-muted); font-size: 13px; margin-top: 5px;">የአስተዳዳሪ ፒን ቁጥር ያስገቡ</p>
      <input type="password" id="adminPin" placeholder="PIN" maxlength="6">
      <button onclick="verifyPin()" style="width: 100%;">ይግቡ</button>
      <p id="authError" style="color: var(--danger); font-size: 12px; margin-top: 10px; display: none;">ተሳስቷል! ደግመው ይሞክሩ።</p>
    </div>
  </div>

  <!-- Dashboard App -->
  <div class="container" id="appContainer">
    <header>
      <h1><i class="fas fa-chart-line"></i> MelaTrack Dashboard</h1>
      <button onclick="window.print()"><i class="fas fa-print"></i> ሪፖርት አትም</button>
    </header>

    <div id="alertBox"></div>

    <!-- Quick Stats -->
    <div class="stats-grid">
      <div class="card">
        <div class="card-title">ጠቅላላ ሰራተኞች</div>
        <div class="card-value" id="statTotalEmployees">0</div>
      </div>
      <div class="card">
        <div class="card-title">ዛሬ የገቡ</div>
        <div class="card-value" style="color: var(--success);" id="statPresentToday">0</div>
      </div>
      <div class="card">
        <div class="card-title">የዘገዩ</div>
        <div class="card-value" style="color: var(--warning);" id="statLateToday">0</div>
      </div>
    </div>

    <!-- Daily Log Section -->
    <h2 style="font-size: 18px; margin-bottom: 12px;">የዕለታዊ መግቢያ ሪፖርት</h2>
    <div class="filter-section">
      <input type="date" id="reportDate">
      <button onclick="loadDashboardData()"><i class="fas fa-sync"></i> አድስ</button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>ስም</th>
            <th>የመግቢያ ሰዓት</th>
            <th>ሁኔታ</th>
            <th>መሳሪያ (Device)</th>
            <th>ተግባር</th>
          </tr>
        </thead>
        <tbody id="dailyLogsTable">
          <tr><td colspan="5" style="text-align: center; color: var(--text-muted);">መረጃ በመጫን ላይ...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Monthly Summary Section -->
    <h2 style="font-size: 18px; margin-bottom: 12px;">ወርሃዊ ማጠቃለያ</h2>
    <div class="filter-section">
      <input type="month" id="monthlyFilter">
      <button onclick="loadMonthlyReport()"><i class="fas fa-filter"></i> አሳይ</button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>ሰራተኛ</th>
            <th>የተገኘበት ቀን</th>
            <th>የዘገየበት ቀን</th>
            <th>የቀረበት ቀን</th>
          </tr>
        </thead>
        <tbody id="monthlySummaryTable">
          <tr><td colspan="4" style="text-align: center; color: var(--text-muted);">መረጃ አልተመረጠም</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Configuration
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyszMPrZV45SvcUv-nCt8v6oKhxJw6DbpD9CnhyhPHZNyT7l0EVks6DaCay53uTkQ8f/exec";
    const SECRET_PIN = "1234"; // የደህንነት ፒን ቁጥር እዚህ ጋር ይቀይሩ

    function verifyPin() {
      const pin = document.getElementById('adminPin').value;
      if(pin === SECRET_PIN) {
        document.getElementById('authOverlay').style.display = 'none';
        document.getElementById('appContainer').style.display = 'block';
        initDashboard();
      } else {
        document.getElementById('authError').style.display = 'block';
      }
    }

    function initDashboard() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('reportDate').value = today;
      document.getElementById('monthlyFilter').value = today.substring(0, 7);
      
      loadDashboardData();
      loadMonthlyReport();
    }

    function showAlert(msg, isError = false) {
      const alertBox = document.getElementById('alertBox');
      alertBox.className = isError ? 'alert-error' : 'alert-success';
      alertBox.innerText = msg;
      alertBox.style.display = 'block';
      setTimeout(() => { alertBox.style.display = 'none'; }, 4000);
    }

    async function loadDashboardData() {
      const dateVal = document.getElementById('reportDate').value;
      const tbody = document.getElementById('dailyLogsTable');
      tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">በመጫን ላይ...</td></tr>';

      try {
        const response = await fetch(`${SCRIPT_URL}?action=getDailyLogs&date=${dateVal}`);
        const data = await response.json();

        if (data.status === 'success') {
          renderDailyTable(data.logs);
          updateStats(data.stats);
        } else {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--danger);">መረጃ ማምጣት አልተቻለም</td></tr>';
        }
      } catch (err) {
        showAlert('Network error: መረጃውን መጫን አልተቻለም', true);
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--danger);">የአውታረ መረብ ስህተት</td></tr>';
      }
    }

    function renderDailyTable(logs) {
      const tbody = document.getElementById('dailyLogsTable');
      if(!logs || logs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">ለዚህ ቀን ምንም አይነት መረጃ የለም</td></tr>';
        return;
      }

      tbody.innerHTML = logs.map(item => `
        <tr>
          <td><strong>${item.name}</strong></td>
          <td>${item.time || '--:--'}</td>
          <td>
            <span style="color: ${item.status === 'በሰዓቱ' ? 'var(--success)' : 'var(--warning)'}">
              ${item.status}
            </span>
          </td>
          <td><small style="color: var(--text-muted);">${item.deviceId || 'ያልተመዘገበ'}</small></td>
          <td>
            <button class="btn-danger" style="padding: 4px 8px; font-size: 12px;" onclick="resetDevice('${item.empId}')">
              <i class="fas fa-mobile-alt"></i> Reset Device
            </button>
          </td>
        </tr>
      `).join('');
    }

    function updateStats(stats) {
      if(!stats) return;
      document.getElementById('statTotalEmployees').innerText = stats.total || 0;
      document.getElementById('statPresentToday').innerText = stats.present || 0;
      document.getElementById('statLateToday').innerText = stats.late || 0;
    }

    async function resetDevice(empId) {
      if(!confirm('እርግጠኛ ነዎት የዚህን ሰራተኛ መሳሪያ መታወቂያ (Device ID) ዳግም ማስጀመር ይፈልጋሉ?')) return;

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'resetDevice', employeeId: empId })
        });
        const res = await response.json();
        
        if(res.status === 'success') {
          showAlert('የመሳሪያው መታወቂያ በተሳካ ሁኔታ ተሰርዟል!');
          loadDashboardData();
        } else {
          showAlert('Device Reset ማድረግ አልተቻለም: ' + res.message, true);
        }
      } catch(err) {
        showAlert('ስህተት ተፈጥሯል: አውታረ መረቡን ያረጋግጡ', true);
      }
    }

    async function loadMonthlyReport() {
      const monthVal = document.getElementById('monthlyFilter').value;
      const tbody = document.getElementById('monthlySummaryTable');
      tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">በመጫን ላይ...</td></tr>';

      try {
        const response = await fetch(`${SCRIPT_URL}?action=getMonthlyReport&month=${monthVal}`);
        const data = await response.json();

        if (data.status === 'success' && data.summary) {
          tbody.innerHTML = data.summary.map(row => `
            <tr>
              <td><strong>${row.name}</strong></td>
              <td style="color: var(--success);">${row.presentDays} ቀን</td>
              <td style="color: var(--warning);">${row.lateDays} ቀን</td>
              <td style="color: var(--danger);">${row.absentDays} ቀን</td>
            </tr>
          `).join('');
        } else {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">ምንም መረጃ አልተገኘም</td></tr>';
        }
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--danger);">መረጃ መጫን አልተቻለም</td></tr>';
      }
    }
  </script>
</body>
</html>
