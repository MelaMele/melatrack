<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MelaTrack - Attendance Check-in</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; width: 320px; }
        h2 { color: #2c3e50; margin-bottom: 20px; }
        input { width: 90%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
        .btn-in { background-color: #2ecc71; color: white; }
        .btn-out { background-color: #e74c3c; color: white; }
        #msg { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>MelaTrack</h2>
        <p>የሰራተኛ ID ያስገቡ</p>
        <input type="number" id="employeeId" placeholder="ምሳሌ፦ 101" required>
        <button class="btn-in" onclick="sendAttendance('checkin')">መግቢያ (Check-in)</button>
        <button class="btn-out" onclick="sendAttendance('checkout')">መውጫ (Check-out)</button>
        <div id="msg"></div>
    </div>

    <script>
        async function sendAttendance(type) {
            const id = document.getElementById('employeeId').value;
            const msgDiv = document.getElementById('msg');
            if(!id) { msgDiv.innerText = "እባክዎን ID ያስገቡ!"; msgDiv.style.color = "red"; return; }

            try {
                const response = await fetch(`/api/${type}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ employee_id: id })
                });
                const result = await response.json();
                if(response.ok) {
                    msgDiv.innerText = result.message;
                    msgDiv.style.color = "green";
                } else {
                    msgDiv.innerText = result.error || "ስህተት ተፈጥሯል";
                    msgDiv.style.color = "red";
                }
            } catch (err) {
                msgDiv.innerText = "ከሰርቨሩ ጋር ማገናኘት አልተቻለም!";
                msgDiv.style.color = "red";
            }
        }
    </script>
</body>
</html>
