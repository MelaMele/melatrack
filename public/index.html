<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>MelaTrack - የሰራተኞች መግቢያ/መውጫ</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--tg-theme-bg-color, #eef2f5); 
            color: var(--tg-theme-text-color, #2c3e50);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 15px; 
        }
        .card { 
            background: var(--tg-theme-secondary-bg-color, white); 
            padding: 30px 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
        }
        h1 { color: var(--tg-theme-text-color, #2c3e50); font-size: 22px; margin-bottom: 5px; }
        p { color: #7f8c8d; font-size: 14px; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        input { 
            width: 100%; 
            padding: 12px; 
            border: 2px solid #bdc3c7; 
            border-radius: 8px; 
            font-size: 16px; 
            text-align: center; 
            outline: none; 
            transition: 0.3s; 
        }
        input:focus { border-color: #3498db; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        button { 
            flex: 1; 
            padding: 12px; 
            border: none; 
            border-radius: 8px; 
            font-size: 15px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.2s; 
            color: white; 
        }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-checkin { background: #2ecc71; }
        .btn-checkin:hover:not(:disabled) { background: #27ae60; }
        .btn-checkout { background: #e74c3c; }
        .btn-checkout:hover:not(:disabled) { background: #c0392b; }
        #msg { margin-top: 20px; font-weight: bold; font-size: 14px; min-height: 20px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>⏱️ MelaTrack</h1>
        <p>የሰራተኛ መግቢያ እና መውጫ መቆጣጠሪያ</p>

        <div class="form-group">
            <input type="number" id="empId" placeholder="የሰራተኛ ID ያስገቡ" autofocus required onkeydown="if(event.key==='Enter') handleAttendance('checkin')">
        </div>

        <div class="btn-group">
            <button type="button" id="btnIn" class="btn-checkin" onclick="handleAttendance('checkin')">📥 Check In</button>
            <button type="button" id="btnOut" class="btn-checkout" onclick="handleAttendance('checkout')">📤 Check Out</button>
        </div>

        <div id="msg"></div>
    </div>

    <script>
        // Telegram WebApp Initialization
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        async function handleAttendance(action) {
            const empIdInput = document.getElementById('empId');
            const empId = empIdInput.value.trim();
            const msgDiv = document.getElementById('msg');
            const btnIn = document.getElementById('btnIn');
            const btnOut = document.getElementById('btnOut');

            if (!empId) {
                msgDiv.innerText = "⚠️ እባክዎን የሰራተኛ ID ያስገቡ!";
                msgDiv.style.color = "#e67e22";
                return;
            }

            // UI Disable & Loading State
            btnIn.disabled = true;
            btnOut.disabled = true;
            msgDiv.innerText = "⏳ በማስመዝገብ ላይ...";
            msgDiv.style.color = "#3498db";

            try {
                const endpoint = action === 'checkin' ? '/api/checkin' : '/api/checkout';
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ employee_id: empId })
                });

                const data = await response.json();

                if (response.ok) {
                    msgDiv.innerText = `✅ ${data.message || 'በተሳካ ሁኔታ ተመዝግቧል!'}`;
                    msgDiv.style.color = "#27ae60";
                    empIdInput.value = ''; // Input ባዶ ማድረግ
                    empIdInput.focus();
                } else {
                    msgDiv.innerText = `❌ ${data.error || 'ስህተት አጋጥሟል'}`;
                    msgDiv.style.color = "#e74c3c";
                }
            } catch (error) {
                msgDiv.innerText = "❌ ከሰርቨር ጋር ማገናኘት አልተቻለም!";
                msgDiv.style.color = "#e74c3c";
            } finally {
                // UI Enable back
                btnIn.disabled = false;
                btnOut.disabled = false;
            }
        }
    </script>
</body>
</html>
