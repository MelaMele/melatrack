<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>MelaTrack - Admin Dashboard</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f8f9fa; padding: 15px; margin: 0; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #34495e; font-size: 22px; }
        .form-group { margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 10px; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; flex: 1; min-width: 130px; }
        button { padding: 10px 15px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2980b9; }
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 14px; }
        th { background-color: #f2f2f2; }
        #statusMsg { font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>MelaTrack - Admin Dashboard</h1>
        
        <h3>አዲስ ሰራተኛ መመዝገቢያ</h3>
        <form id="addEmpForm" onsubmit="addEmployee(event)">
            <div class="form-group">
                <input type="text" id="name" placeholder="ሙሉ ስም" required>
                <input type="text" id="dept" placeholder="የስራ ክፍል" required>
                <input type="text" id="phone" placeholder="ስልክ ቁጥር" required>
                <button type="submit">መዝግብ</button>
            </div>
        </form>
        <div id="statusMsg"></div>

        <hr style="margin: 20px 0;">

        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 style="margin: 0;">የዛሬ የክትትል ሪፖርት</h3>
            <button onclick="loadReport()">ሪፖርት አድስ</button>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>ስም</th>
                        <th>የስራ ክፍል</th>
                        <th>መግቢያ</th>
                        <th>መውጫ</th>
                        <th>ሁኔታ</th>
                    </tr>
                </thead>
                <tbody id="reportTable">
                    <tr><td colspan="6" style="text-align:center;">መረጃው እየተጫነ ነው...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Initialize Telegram WebApp
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        async function addEmployee(event) {
            event.preventDefault();
            const msgDiv = document.getElementById('statusMsg');
            msgDiv.innerText = "እየመዘገበ ነው...";
            msgDiv.style.color = "blue";

            const name = document.getElementById('name').value;
            const dept = document.getElementById('dept').value;
            const phone = document.getElementById('phone').value;

            try {
                const res = await fetch('/api/employees', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ full_name: name, department: dept, phone: phone })
                });
                
                const data = await res.json();
                if(res.ok) {
                    msgDiv.innerText = `ተሳክቷል! ID: ${data.id}`;
                    msgDiv.style.color = "green";
                    document.getElementById('addEmpForm').reset();
                    loadReport();
                } else {
                    msgDiv.innerText = "ስህተት፦ " + (data.error || "መመዝገብ አልተቻለም");
                    msgDiv.style.color = "red";
                }
            } catch (err) {
                msgDiv.innerText = "ከሰርቨሩ ጋር ማገናኘት አልተቻለም!";
                msgDiv.style.color = "red";
            }
        }

        async function loadReport() {
            const tbody = document.getElementById('reportTable');
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">መረጃው እየተጫነ ነው...</td></tr>';
            
            try {
                const res = await fetch('/api/report');
                const data = await res.json();
                tbody.innerHTML = '';
                
                if(Array.isArray(data)) {
                    if(data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">ምንም ሰራተኛ አልተመዘገበም</td></tr>';
                        return;
                    }
                    data.forEach(row => {
                        tbody.innerHTML += `
                            <tr>
                                <td>${row.id}</td>
                                <td>${row.full_name}</td>
                                <td>${row.department || '-'}</td>
                                <td>${row.check_in || '-'}</td>
                                <td>${row.check_out || '-'}</td>
                                <td>${row.status === 'Present' ? '✅ Present' : '❌ Absent'}</td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:red;">መረጃ ማምጣት አልተቻለም</td></tr>';
                }
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:red;">ከሰርቨር ጋር ማገናኘት አልተቻለም</td></tr>';
            }
        }
        
        window.onload = loadReport;
    </script>
</body>
</html>
