<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MelaTrack - ሰራተኛ መግቢያና መውጫ</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 420px; text-align: center; }
        .card h2 { margin-top: 0; color: #2c3e50; font-size: 22px; margin-bottom: 5px; }
        .sub-title { color: #7f8c8d; font-size: 13px; margin-bottom: 20px; }
        
        .form-group { text-align: left; margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #333; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; }
        .btn-in { background-color: #2ecc71; }
        .btn-out { background-color: #e74c3c; }
        .btn-leave { background-color: #f39c12; width: 100%; margin-top: 10px; }

        #statusMsg { margin-top: 15px; font-size: 13px; font-weight: bold; padding: 10px; border-radius: 6px; display: none; }
        .gps-status { font-size: 11px; color: #7f8c8d; margin-top: 5px; display: flex; align-items: center; justify-content: center; gap: 5px; cursor: pointer; }
        
        .leave-section { border-top: 1px solid #eee; margin-top: 20px; padding-top: 15px; text-align: left; }
        footer { margin-top: 25px; font-size: 11px; color: #bdc3c7; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>🏢 MelaTrack</h2>
    <div class="sub-title">የሰራተኛ መግቢያና መውጫ ፖርታል</div>

    <div id="statusMsg"></div>

    <div class="form-group">
        <label for="employeeId">የሰራተኛ ID ቁጥር</label>
        <input type="text" id="employeeId" placeholder="ምሳሌ፦ EMP-101" required>
    </div>

    <!-- GPS status ላይ ሲጫኑ እንደገና GPS እንዲፈልግ ተደርጓል -->
    <div class="gps-status" id="gpsStatus" onclick="getGPSLocation()">
        📍 GPS አድራሻ በመፈለግ ላይ... (እንደገና ለመፈለግ እዚህ ይጫኑ)
    </div>

    <div class="btn-group">
        <button class="btn btn-in" onclick="handleAttendance('CheckIn')">📥 Check In</button>
        <button class="btn btn-out" onclick="handleAttendance('CheckOut')">📤 Check Out</button>
    </div>

    <!-- የፈቃድ ጥያቄ ማቅረቢያ -->
    <div class="leave-section">
        <div class="form-group">
            <label for="leaveReason">የቀሪ / የፈቃድ ምክንያት (ካለዎት)</label>
            <textarea id="leaveReason" rows="2" placeholder="ዛሬ ስራ የማልመጣበት ምክንያት..."></textarea>
        </div>
        <button class="btn btn-leave" onclick="handleAttendance('Permission')">📝 የፈቃድ ጥያቄ ላክ</button>
    </div>

    <footer>Powered by Melak Advertising +251913064239</footer>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyszMPrZV45SvcUv-nCt8v6oKhxJw6DbpD9CnhyhPHZNyT7l0EVks6DaCay53uTkQ8f/exec";
    
    let currentLat = null;
    let currentLng = null;

    window.onload = function() {
        getGPSLocation();
        
        const savedId = localStorage.getItem('melatrack_emp_id');
        if (savedId) {
            document.getElementById('employeeId').value = savedId;
        }
    };

    function getGPSLocation() {
        const gpsLabel = document.getElementById('gpsStatus');
        gpsLabel.innerHTML = '🔄 GPS አድራሻ በመፈለግ ላይ...';
        gpsLabel.style.color = '#7f8c8d';

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    currentLat = pos.coords.latitude;
                    currentLng = pos.coords.longitude;
                    gpsLabel.innerHTML = '✅ GPS አድራሻ ተገኝቷል (ለማደስ ይጫኑ)';
                    gpsLabel.style.color = '#2ecc71';
                },
                (err) => {
                    gpsLabel.innerHTML = '❌ GPS መክፈት አልተቻለም! እባክዎን Location ያብሩና እዚህ ይጫኑ';
                    gpsLabel.style.color = '#e74c3c';
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        } else {
            gpsLabel.innerHTML = '❌ የስልክዎ ብራውዘር GPS አያግዝም';
        }
    }

    function getDeviceId() {
        let devId = localStorage.getItem('melatrack_device_id');
        if (!devId) {
            devId = 'DEV-' + Math.random().toString(36).substring(2, 9) + '-' + Date.now();
            localStorage.setItem('melatrack_device_id', devId);
        }
        return devId;
    }

    async function handleAttendance(type) {
        const empId = document.getElementById('employeeId').value.trim();
        const reason = document.getElementById('leaveReason').value.trim();

        if (!empId) {
            showMsg('❌ እባክዎን የሰራተኛ ID ቁጥርዎን ያስገቡ!', '#e74c3c');
            return;
        }

        if (type === 'Permission' && !reason) {
            showMsg('❌ እባክዎን የፈቃድ/የቀሪ ምክንያትዎን ይፃፉ!', '#e74c3c');
            return;
        }

        if (!currentLat || !currentLng) {
            getGPSLocation();
            showMsg('⏳ GPS አድራሻዎን በመፈለግ ላይ ነው... እባክዎን ጥቂት ሰከንድ ቆይተው ድጋሚ ይሞክሩ', '#f39c12');
            return;
        }

        localStorage.setItem('melatrack_emp_id', empId);
        showMsg('⏳ ጥያቄዎ በመላክ ላይ ነው...', '#3498db');

        const payload = {
            action: 'logAttendance',
            employee_id: empId,
            type: type,
            latitude: currentLat,
            longitude: currentLng,
            device_id: getDeviceId(),
            reason: reason
        };

        try {
            const res = await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });

            const data = await res.json();

            if (data.status === 'success') {
                showMsg('✅ ' + data.message, '#2ecc71');
                document.getElementById('leaveReason').value = ''; // መስኩን ማፅዳት
            } else {
                showMsg('⚠️ ' + data.message, '#e74c3c');
            }

        } catch (err) {
            showMsg('❌ መረጃውን መላክ አልተቻለም! ኢንተርኔትዎን ያረጋግጡ።', '#e74c3c');
        }
    }

    function showMsg(text, color) {
        const msg = document.getElementById('statusMsg');
        msg.innerText = text;
        msg.style.backgroundColor = color;
        msg.style.color = 'white';
        msg.style.display = 'block';
    }
</script>

</body>
</html>
